<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Atlas</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Paper Atlas</div>
    <nav class="tabs">
      <a href="#/map" data-tab="map">论文地图</a>
      <a href="#/graph" data-tab="graph">相关论文图</a>
      <a href="#/flows" data-tab="flows">知识流</a>
    </nav>
    <div class="topbar-right">
      <label class="demo-toggle" title="使用内置的合成数据，不调用 OpenAlex"><input type="checkbox" id="demo-mode" /> 演示数据</label>
      <button id="settings-btn" class="ghost">设置</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="status" class="status hidden"></div>
  <div id="tooltip" class="tooltip hidden"></div>

  <dialog id="settings">
    <form method="dialog">
      <h3>设置</h3>
      <p class="muted">数据来自 <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a>。不填 key 时共享一个很小的免费日额度；在 openalex.org/settings/api 免费申请 key 可获得独立额度。key 只保存在本浏览器。</p>
      <label>OpenAlex API key <input id="api-key" type="password" autocomplete="off" placeholder="可选" /></label>
      <label><input id="clear-cache" type="checkbox" /> 清空本地请求缓存</label>
      <div class="row end"><button value="cancel" class="ghost">取消</button><button id="settings-save" value="save">保存</button></div>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
