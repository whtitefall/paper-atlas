<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Atlas</title>
  <meta name="description" content="Explore AI research papers from top conferences, journals and arXiv: a semantic paper map, related-paper graphs and knowledge flows." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/map">
      <img class="logo" src="/logo.svg" alt="" width="28" height="28" />
      <span>Paper Atlas</span>
    </a>
    <nav class="tabs">
      <a href="#/map" data-tab="map" data-icon="map"><span data-i18n="nav.map">论文地图</span></a>
      <a href="#/graph" data-tab="graph" data-icon="graph"><span data-i18n="nav.graph">相关论文图</span></a>
      <a href="#/flows" data-tab="flows" data-icon="flows"><span data-i18n="nav.flows">知识流</span></a>
    </nav>
    <div class="topbar-right">
      <span id="data-info" class="muted small"></span>
      <button id="lang-btn" class="ghost small" data-icon="globe" data-i18n-title="lang.title"><span data-i18n="lang.toggle">EN</span></button>
      <a class="btn small ghost" data-icon="code" href="https://github.com/whtitefall/paper-atlas" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>
  <main id="app"></main>
  <div id="status" class="status hidden"></div>
  <div id="tooltip" class="tooltip hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
