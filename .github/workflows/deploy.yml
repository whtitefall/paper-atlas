# Fetches paper metadata, rebuilds the static atlas and deploys the site to GitHub Pages.
# Turn it on once in Settings -> Pages -> Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *' # every day, 03:23 UTC
  workflow_dispatch:
    inputs:
      arxiv:
        description: 'Fetch arXiv too (the first harvest takes a few hours)'
        type: boolean
        default: true
      refresh:
        description: 'Ignore the download cache and refetch everything'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/requirements-build.txt

      - run: pip install -r requirements.txt -r scripts/requirements-build.txt

      # Raw responses from the paper sites; with them, a run only downloads what is new.
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Quick sources first, then the per-paper sources side by side, one host each, for at most
      # FETCH_BUDGET_MIN minutes. A source that is down or slow doesn't block the deploy: the build
      # uses whatever was fetched, and the next run continues from the cache.
      - name: Fetch papers
        run: bash scripts/ci_fetch.sh $REFRESH
        timeout-minutes: 230
        continue-on-error: true
        env:
          FETCH_BUDGET_MIN: 200
          SKIP_ARXIV: ${{ (github.event_name == 'workflow_dispatch' && !inputs.arxiv) && '1' || '' }}

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Build the atlas
        run: python scripts/build_atlas.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
